[project]
name = "crisis-resource-navigator"
version = "1.0.0"
description = "Slack agent that matches disaster-community needs to local offers (Real-Time Search) and official resources (MCP), with a human always in the loop."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Junwei Lai" },
]

# Runtime deps only. Dev/test go in [dependency-groups].
# Migrated from the `bolt-python-starter-agent --subdir pydantic-ai` template (W1).
dependencies = [
    "slack-sdk>=3.42",
    "slack-bolt>=1.29.0",
    "slack-cli-hooks<1.0.0",
    "pydantic-ai-slim[anthropic,openai,google]",
    "python-dotenv>=1.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "fastmcp>=3.4,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.15",
    "pre-commit>=4",
]

[tool.uv]
# App, not a library — nothing to build/install as a package.
package = false

# ----- ruff -----

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "SIM",     # flake8-simplify
    "RUF",     # ruff-specific
]
ignore = [
    "E501",  # line too long — the formatter owns this
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----- pytest -----

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-ra --strict-markers"
markers = [
    "live: hits a real external service (e.g. a live LLM). Skipped unless a provider key is configured; never runs in CI without secrets.",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
filterwarnings = ["error"]
