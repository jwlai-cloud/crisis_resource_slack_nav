name: Deploy landing page to GitHub Pages

# Publishes docs/site/ (the static field-guide landing page) to GitHub Pages.
# One-time: repo Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# After that this runs on every push to dev that touches the page, and on demand.

on:
  push:
    branches: [dev]
    paths:
      - "docs/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live Pages deploy at a time; let an in-flight run finish (don't cancel a deploy).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
